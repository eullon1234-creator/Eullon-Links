# Workflow para compilar e implantar o Eullon Links no GitHub Pages
name: Deploy Eullon Links

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante apenas um deploy concorrente por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Compilar projeto (Vite Build)
        run: npm run build

      - name: Compactar Extensão para Download
        run: |
          cd dist
          zip -r eullon-links-extension.zip . -x "eullon-links-extension.zip"
          cd ..

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Carregar artefatos da pasta dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Implantar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
